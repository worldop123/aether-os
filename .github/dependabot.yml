# Dependabot 依赖更新配置
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # npm 依赖更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "worldop123"
    assignees:
      - "worldop123"
    groups:
      # TypeScript 类型定义一起更新
      types:
        patterns:
          - "@types/*"
      # 开发工具一起更新
      dev-tools:
        patterns:
          - "typescript"
          - "vitest"
          - "@vitest/*"
      # better-sqlite3 相关一起更新
      sqlite:
        patterns:
          - "better-sqlite3"
          - "@types/better-sqlite3"

  # GitHub Actions 版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    reviewers:
      - "worldop123"
