name: 欢迎新贡献者

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    name: 欢迎消息
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: 检查是否是首次贡献
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const item = context.payload.pull_request || context.payload.issue;
            const author = item.user.login;

            // 查询该用户之前的 PR 和 Issue 数量
            const query = isPR
              ? `repo:${context.repo.owner}/${context.repo.repo} type:pr author:${author}`
              : `repo:${context.repo.owner}/${context.repo.repo} type:issue author:${author}`;

            const response = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 2
            });

            // 如果是首次贡献（只有当前这一个）
            if (response.data.total_count === 1) {
              const welcomeMsg = isPR
                ? `👋 欢迎 @${author}！感谢你提交第一个 Pull Request！

我们很高兴你的加入。维护者会尽快审查你的代码。在等待期间，你可以：

- 阅读 [贡献指南](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)
- 查看 [架构文档](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/ARCHITECTURE.md)
- 在 [Discussions](https://github.com/${context.repo.owner}/${context.repo.repo}/discussions) 中参与讨论

再次感谢你的贡献！🎉`
                : `👋 欢迎 @${author}！感谢你提交第一个 Issue！

我们很重视你的反馈。维护者会尽快回复你。在等待期间，你可以：

- 阅读 [文档](https://github.com/${context.repo.owner}/${context.repo.repo}/#readme)
- 在 [Discussions](https://github.com/${context.repo.owner}/${context.repo.repo}/discussions) 中提问
- 查看 [CHANGELOG](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md) 了解最新变更

再次感谢你的参与！🎉`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                body: welcomeMsg
              });
            }
